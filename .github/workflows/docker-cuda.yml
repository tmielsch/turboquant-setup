name: Build CUDA container

on:
  pull_request:
    paths:
      - "docker/**"
      - "compose.yaml"
      - "llama-swap/**"
      - ".github/workflows/docker-cuda.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "compose.yaml"
      - "llama-swap/**"
      - ".github/workflows/docker-cuda.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PR image (validation only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cuda
          platforms: linux/amd64
          push: false
          tags: local/turboquant-setup:cuda
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish CUDA image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=llama-swap + TheTom TurboQuant llama.cpp CUDA runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max
