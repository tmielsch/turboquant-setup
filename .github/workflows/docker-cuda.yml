name: Build CUDA container

# CUDA compilation is expensive. Do not rebuild the engine for every PR commit.
# Runtime model variants (200K/250K/MTP) are config only and never need a rebuild.
on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/docker-cuda.yml"
  workflow_dispatch:

concurrency:
  group: cuda-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exactly one image / one CUDA engine. All llama-swap model IDs reuse it.
      - name: Build and publish CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cuda
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=llama-swap + TheTom TurboQuant llama.cpp CUDA runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max
