services:
  turboquant:
    image: ghcr.io/tmielsch/turboquant-setup:cuda
    container_name: turboquant
    restart: unless-stopped

    ports:
      - "9292:9292"

    volumes:
      - "${MODELS_DIR:-./models}:/models:ro"
      - "./llama-swap/config.yaml:/config/config.yaml:ro"

    environment:
      # Allow explicitly configured turbo2 K caches to stay turbo2 on GQA models.
      # Per-model K/V choices belong in llama-swap/config.yaml.
      TURBO_AUTO_ASYMMETRIC: "0"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9292/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
