FORK_URL=https://github.com/TheTom/llama-cpp-turboquant
FORK_BRANCH=feature/turboquant-kv-cache
ENGINE_DIR=engine/llama-cpp-turboquant
BUILD_DIR=engine/build-turboquant
PORT=8080
HOST=127.0.0.1

# Long-context targets for the 16 GB RTX 4070 Ti SUPER.
CTX_9B=32768
CTX_27B=200000
CTX_27B_MAX=250000
FIT=on
FIT_TARGET_MIB=512

# KV presets. Keep K more precise than V; turbo2-V is the long-context lever.
KV_K_9B=q8_0
KV_V_9B=turbo3
KV_K_27B=q8_0
KV_V_27B=turbo2

# Qwen3.8 MTP is optional because the draft head also consumes VRAM.
MTP_DRAFT_N_MAX=3
MTP_CHAIN=8

MODEL_9B=models/Qwen3.5-9B-Q4_K_M.gguf
MODEL_27B=models/Qwen3.8-27B-UD-Q3_K_XL.gguf
MTP_DRAFT_27B=models/mtp-Qwen3.8-27B-Q4_0.gguf
MMPROJ=models/mmproj-BF16.gguf
