FORK_URL=https://github.com/TheTom/llama-cpp-turboquant
FORK_BRANCH=feature/turboquant-kv-cache
ENGINE_DIR=engine/llama-cpp-turboquant
BUILD_DIR=engine/build
PORT=8080
HOST=127.0.0.1

# 16 GB / long-context target. Keep context fixed and let llama.cpp fit GPU layers.
CTX_9B=32768
CTX_27B=200000
CTX_27B_MAX=250000
GPU_LAYERS=auto
VRAM_FIT=1

# TurboQuant KV cache. Symmetric turbo2 maximizes KV compression for 200K+ context.
KV_K_9B=q8_0
KV_V_9B=turbo3
KV_K_27B=turbo2
KV_V_27B=turbo2

MODEL_9B=models/Qwen3.5-9B-Q4_K_M.gguf
MODEL_27B=models/Qwen3.8-27B-UD-Q3_K_XL.gguf
MTP_DRAFT_27B=models/mtp-Qwen3.8-27B-Q4_0.gguf
MMPROJ=models/mmproj-BF16.gguf
