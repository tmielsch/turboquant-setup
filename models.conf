# turboquant-setup model registry
#
# Central configuration for all models served through llama-swap.
# Edit this file (or use `bash scripts/add-model.sh`) and then regenerate
# the llama-swap config:
#
#   bash scripts/generate-config.sh
#   docker compose restart turboquant
#
# No Docker image rebuild is ever needed: the generated config is bind-mounted
# into the container.
#
# Format: INI-style sections. `#` starts a comment. See docs/MODELS.md.

[global]
# Absolute path of the llama-server binary inside the container.
engine=/app/llama-server
# How much VRAM (MiB) to leave free for the KV cache offload buffer.
fit_target=512
# Default KV cache quantizations (see docs/MODELS.md for options).
# turbo2 for BOTH K and V: the only way a 13 GB 27B model reaches long
# context on 16 GB VRAM. q8_0 K would need ~6.5 GB at 200K and force most
# layers off the GPU (measured: ~3-4 tok/s instead of 23+).
# NOTE: TURBO_AUTO_ASYMMETRIC=0 is set in compose.yaml, otherwise the engine
# silently upgrades K back to q8_0 for GQA models.
kv_k=turbo2
kv_v=turbo2

# ---------------------------------------------------------------------------
# Models: one [model:<id>] section per model ID.
# Required keys: file (GGUF filename, relative to MODELS_DIR), context.
# Optional keys: name, description, kv_k, kv_v, mtp_draft, tools.
#
# Measured decode speed on a 16 GB RTX 4070 Ti SUPER (Q3_K_XL, turbo2 KV):
#   64K context: ~23 tok/s   <- daily driver
#  128K context: ~15 tok/s
#  200K context: ~11 tok/s
#  MTP profiles are NOT viable on a 16 GB card: the MTP draft GGUF for the
#  27B model expands to ~12.9 GB in VRAM (full model in Q4_0), so main model
#  + draft never fit together (measured: 1.9 tok/s with massive CPU offload).
# ---------------------------------------------------------------------------

[model:qwen3.5-9b-32k]
name=Qwen3.5 9B - 32K
description=Smoke-test / lightweight profile. q8_0 K + turbo3 V.
file=gguf/Qwen3.5-9B-Q4_K_M.gguf
context=32768
kv_v=turbo3

[model:qwen3.8-27b-64k]
name=Qwen3.8 27B - 64K
description=Daily driver: full GPU residency, ~23 tok/s decode.
file=gguf/Qwen3.8-27B-UD-Q3_K_XL.gguf
context=65536

[model:qwen3.8-27b-128k]
name=Qwen3.8 27B - 128K
description=Long context, ~15 tok/s decode.
file=gguf/Qwen3.8-27B-UD-Q3_K_XL.gguf
context=131072

[model:qwen3.8-27b-200k]
name=Qwen3.8 27B - 200K
description=Maximum-context profile, ~11 tok/s decode.
file=gguf/Qwen3.8-27B-UD-Q3_K_XL.gguf
context=200000

[model:qwen3.8-27b-250k]
name=Qwen3.8 27B - 250K
description=Absolute maximum context, ~10 tok/s decode.
file=gguf/Qwen3.8-27B-UD-Q3_K_XL.gguf
context=250000

[model:qwen3.6-35b-a3b-250k]
name=Qwen3.6 35B A3B - 250K
description=MoE daily driver: 3B active, DeltaNet attention (tiny KV cache), 250K context. Spill handled via --moe-cache soft.
file=gguf/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
context=250000
moe_cache=soft

[model:qwen3.6-35b-a3b-q8-250k]
name=Qwen3.6 35B A3B - Q8_0 250K
description=High-quality 8-bit variant (non-UD), MoE cache enabled.
file=gguf/Qwen3.6-35B-A3B-Q8_0.gguf
context=250000
moe_cache=soft

[model:qwen3.6-35b-a3b-q6-250k]
name=Qwen3.6 35B A3B - Q6_K 250K
description=Mid-quality 6-bit UD variant, MoE cache enabled.
file=gguf/Qwen3.6-35B-A3B-UD-Q6_K.gguf
context=250000
moe_cache=soft

[model:qwen3.6-35b-a3b-bf16-250k]
name=Qwen3.6 35B A3B - BF16 250K
description=Full-precision BF16 (2-part split). MoE cache does NOT support BF16 matvec, so decode streams experts over PCIe (slow decode, best quality).
file=gguf/Qwen3.6-35B-A3B-BF16-00001-of-00002.gguf
context=250000

[model:deepseek-v4-flash-64k]
name=DeepSeek V4 Flash - 64K
description=DeepSeek V4 Flash 0731 (284B MoE, 21B active, MXFP4 routed experts). CPU-MoE: all 137 GiB routed experts run on CPU, ~13.7 GiB BF16 backbone on GPU. FP16 KV mandatory for V4 arch (quantized KV silently corrupts). Slow decode on 16 GB GPU.
file=DeepSeek-V4-Flash-0731-UD-Q8_K_XL/UD-Q8_K_XL/DeepSeek-V4-Flash-0731-UD-Q8_K_XL-00001-of-00005.gguf
context=65536
kv_k=f16
kv_v=f16
cpu_moe=true
