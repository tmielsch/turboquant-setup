# turboquant-setup model registry
#
# Central configuration for all models served through llama-swap.
# Edit this file (or use `bash scripts/add-model.sh`) and then regenerate
# the llama-swap config:
#
#   bash scripts/generate-config.sh
#   docker compose restart turboquant
#
# No Docker image rebuild is ever needed: the generated config is bind-mounted
# into the container.
#
# Format: INI-style sections. `#` starts a comment. See docs/MODELS.md.

[global]
# Absolute path of the llama-server binary inside the container.
engine=/app/llama-server
# How much VRAM (MiB) to leave free for the KV cache offload buffer.
fit_target=512
# Default KV cache quantizations (see docs/MODELS.md for options).
kv_k=q8_0
kv_v=turbo2

# ---------------------------------------------------------------------------
# Models: one [model:<id>] section per model ID.
# Required keys: file (GGUF filename, relative to MODELS_DIR), context.
# Optional keys: name, description, kv_k, kv_v, mtp_draft, tools.
# ---------------------------------------------------------------------------

[model:qwen3.5-9b-32k]
name=Qwen3.5 9B - 32K
description=Smoke-test / lightweight profile. q8_0 K + turbo3 V.
file=Qwen3.5-9B-Q4_K_M.gguf
context=32768
kv_v=turbo3

[model:qwen3.8-27b-200k]
name=Qwen3.8 27B - 200K
description=Primary long-context profile. Asymmetric TurboQuant: q8_0 K + turbo2 V.
file=Qwen3.8-27B-UD-Q3_K_XL.gguf
context=200000

[model:qwen3.8-27b-250k]
name=Qwen3.8 27B - 250K
description=Maximum-context profile. Asymmetric TurboQuant: q8_0 K + turbo2 V.
file=Qwen3.8-27B-UD-Q3_K_XL.gguf
context=250000

[model:qwen3.8-27b-200k-mtp]
name=Qwen3.8 27B - 200K + MTP
description=200K long-context profile with Qwen MTP speculative decoding.
file=Qwen3.8-27B-UD-Q3_K_XL.gguf
context=200000
mtp_draft=mtp-Qwen3.8-27B-Q4_0.gguf

[model:qwen3.8-27b-250k-mtp]
name=Qwen3.8 27B - 250K + MTP
description=250K maximum-context profile with Qwen MTP speculative decoding.
file=Qwen3.8-27B-UD-Q3_K_XL.gguf
context=250000
mtp_draft=mtp-Qwen3.8-27B-Q4_0.gguf
