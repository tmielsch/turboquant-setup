# Repository baseline for llama-swap.
# Copy this file to config.yaml once on a new machine, then edit config.yaml locally.
# config.yaml is intentionally gitignored and must never be overwritten by setup or maintenance scripts.
# This example is not automatically synchronized with any machine's live configuration.
# Multiple virtual model IDs may point to the same GGUF with different runtime flags.

startPort: 5800
sendLoadingState: false
globalTTL: 0

macros:
  engine: "/app/llama-server"
  fit_target: "512"

models:
  "deepseek-v4-flash-128k":
    name: "DeepSeek V4 Flash - 128K"
    description: "Config-I, FP16 KV, CPU-MoE + moe-cache on. MLA latent KV cache, 128K context."
    cmd: |
      "${engine}" --host 127.0.0.1 --port ${PORT}
      --alias ${MODEL_ID}
      -m "/models/DeepSeek-V4-Flash-ConfigI-GGUF/DeepSeek-V4-Flash-0731-ConfigI-00001-of-00003.gguf"
      -fit on -fitt ${fit_target}
      -c 131072
      -ctk f16 -ctv f16
      --flash-attn on --jinja -np 1
      --moe-cache on
      -cmoe
      --dry-multiplier 0.8 --dry-base 1.75
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 131072
  "deepseek-v4-flash-256k":
    name: "DeepSeek V4 Flash - 256K"
    description: "Config-I, FP16 KV, CPU-MoE + moe-cache on. 256K context."
