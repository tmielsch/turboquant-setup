# Apply with:       docker compose restart turboquant

startPort: 5800
sendLoadingState: false
globalTTL: 0

macros:
  engine: "/app/llama-server"
  fit_target: "512"

models:
  "qwen3.5-9b-32k":
    name: "Qwen3.5 9B - 32K"
    description: "Smoke-test / lightweight profile. q8_0 K + turbo3 V."
    cmd: |
      "${engine}" --host 127.0.0.1 --port ${PORT}
      --alias ${MODEL_ID}
      -m "/models/Qwen3.5-9B-Q4_K_M.gguf"
      -fit on -fitt ${fit_target}
      -c 32768
      -ctk q8_0 -ctv turbo3
      --flash-attn on --jinja -np 1
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 32768
  "qwen3.8-27b-200k":
    name: "Qwen3.8 27B - 200K"
    description: "Primary long-context profile. Asymmetric TurboQuant: q8_0 K + turbo2 V."
