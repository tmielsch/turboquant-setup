# AUTO-GENERATED from models.conf by scripts/generate-config.sh.
# Do not edit by hand - your changes will be overwritten.
# Regenerate with:  bash scripts/generate-config.sh
# Apply with:       docker compose restart turboquant

startPort: 5800
sendLoadingState: false
globalTTL: 0

macros:
  engine: "/app/llama-server"
  fit_target: "512"

models:
  "qwen3.5-9b-32k":
    name: "Qwen3.5 9B - 32K"
    description: "Smoke-test / lightweight profile. q8_0 K + turbo3 V."
    cmd: |
      "${engine}" --host 127.0.0.1 --port ${PORT}
      --alias ${MODEL_ID}
      -m "/models/Qwen3.5-9B-Q4_K_M.gguf"
      -fit on -fitt ${fit_target}
      -c 32768
      -ctk turbo2 -ctv turbo3
      --flash-attn on --jinja -np 1
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 32768
  "qwen3.6-35b-a3b-250k":
